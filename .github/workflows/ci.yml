name: CI

# Runs the tests and builds the site on every push and pull request.
on:
  push:
  pull_request:

jobs:
  pipeline:
    name: Data pipeline (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      # No Gemini key needed: every hard prereq is answered from the committed cache.
      - run: pytest

  web:
    name: Website (tests, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      # Reads the files in data/ and writes the static site to web/out/.
      - run: npm run build
